<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>@milayaqueen</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070708;
  --bg2:#0b0b0e;
  --panel:#0e0e11;
  --line:#1c1c21;
  --line-soft:#131317;
  --ink:#e6e0df;
  --ink-soft:#c7c0bf;
  --dim:#6e696a;
  --dim-2:#545052;
  --bone:#b8b2ad;
  --blood:#8a2730;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Jost',sans-serif;
  font-weight:300;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  background-image:
    radial-gradient(circle at 50% -8%, #141317 0%, transparent 60%),
    linear-gradient(var(--line-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
  background-size:auto, 44px 44px, 44px 44px;
  background-attachment:fixed;
  letter-spacing:.3px;
}
.serif{font-family:'Cormorant Garamond',serif}
.container{max-width:640px;margin:0 auto;padding:28px 18px 40px}

/* ---- hero / name ---- */
.hero{text-align:center;padding:44px 0 6px}
.queen{
  font-family:'Cormorant Garamond',serif;
  font-weight:400;
  font-size:clamp(46px,12vw,84px);
  line-height:.92;
  letter-spacing:.5px;
  color:var(--ink);
}
.queen .at{color:var(--blood);font-weight:500;padding-right:6px}

.sect-label{
  display:flex;align-items:center;gap:14px;
  margin:44px 0 6px;
  font-size:10px;letter-spacing:4px;text-transform:uppercase;
  color:var(--dim);font-weight:400;
}
.sect-label::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---- products ---- */
#products{min-height:120px;margin-top:14px}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  display:flex;
  gap:18px;
  align-items:flex-start;
  padding:18px;
  margin:12px 0;
  transition:border-color .35s ease, transform .35s ease;
}
.card:hover{border-color:#26262c}
.card img{
  width:96px;height:96px;object-fit:cover;flex-shrink:0;
  background:var(--bg2);border:1px solid var(--line);
  filter:grayscale(45%) contrast(1.05);
}
.card-body{flex:1;min-width:0}
.cat{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--dim-2);margin-bottom:6px}
.card-title{
  font-family:'Cormorant Garamond',serif;
  font-size:20px;line-height:1.15;font-weight:500;color:var(--ink);
}
.desc{
  margin-top:7px;color:var(--ink-soft);font-size:13px;font-weight:300;line-height:1.5;
  white-space:pre-wrap;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.price{
  margin-top:12px;display:flex;align-items:center;gap:10px;
  font-size:15px;color:var(--ink);font-weight:400;letter-spacing:.5px;
}
.price .unit{color:var(--dim);font-size:10px;letter-spacing:3px;text-transform:uppercase}
.buy-btn{
  margin-top:14px;
  background:transparent;color:var(--ink);
  border:1px solid var(--dim-2);
  font-family:'Jost',sans-serif;font-weight:300;
  font-size:11px;letter-spacing:4px;text-transform:uppercase;
  padding:11px 26px;cursor:pointer;
  transition:all .3s ease;
}
.buy-btn:hover{background:var(--blood);border-color:var(--blood);color:#fff}
.buy-btn:disabled{opacity:.35;cursor:wait}

/* ---- messages ---- */
.msg{padding:16px;margin:12px 0;font-size:13px;font-weight:300;color:var(--ink-soft);
  border:1px solid var(--line);text-align:center;letter-spacing:1px}
.msg.err{border-color:rgba(138,39,48,.5);color:var(--blood)}
.loader{padding:60px 0;text-align:center;color:var(--dim);
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;letter-spacing:1px}

/* ---- footer ---- */
.footer{
  margin:64px 0 8px;text-align:center;
  font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--dim-2);
}
.footer a{color:var(--dim-2);text-decoration:none;transition:color .3s}
.footer a:hover{color:var(--ink-soft)}
.footer .sep{color:var(--line);padding:0 8px}
.admin-ghost{
  background:none;border:none;color:var(--dim-2);cursor:pointer;
  font-family:inherit;font-size:inherit;letter-spacing:inherit;text-transform:inherit;
  padding:0;transition:color .3s;
}
.admin-ghost:hover{color:var(--blood)}

/* ---- modals ---- */
.overlay{
  display:none;position:fixed;inset:0;z-index:60;
  background:rgba(3,3,4,.82);backdrop-filter:blur(3px);
  align-items:center;justify-content:center;padding:20px;
}
.overlay.show{display:flex}
.dialog{
  background:var(--bg2);border:1px solid var(--line);
  width:100%;max-width:420px;padding:26px 24px;position:relative;
  box-shadow:0 18px 60px rgba(0,0,0,.6);
}
.dialog h3{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:24px;
  color:var(--ink);text-align:center;letter-spacing:1px}
.dialog .sub{font-size:10px;letter-spacing:3px;text-transform:uppercase;
  color:var(--dim-2);text-align:center;margin:6px 0 18px}
.req-table{width:100%;border:1px solid var(--line);border-collapse:collapse;margin:4px 0 16px}
.req-table td{padding:9px 12px;border-bottom:1px solid var(--line-soft);font-size:12px;vertical-align:top}
.req-table tr:last-child td{border-bottom:none}
.req-table td.k{width:74px;color:var(--dim-2);letter-spacing:2px;text-transform:uppercase;font-size:9px;padding-top:12px}
.req-table td.v{color:var(--ink-soft);word-break:break-all;font-weight:300}
.req-table td.v b{color:var(--ink);font-weight:400}
.wallet-cta{
  width:100%;padding:14px;background:var(--blood);color:#fff;border:none;cursor:pointer;
  font-family:'Jost',sans-serif;font-size:12px;letter-spacing:4px;text-transform:uppercase;font-weight:400;
  transition:opacity .3s;
}
.wallet-cta:hover{opacity:.85}
.wallet-cta:disabled{opacity:.4}
.mini-row{display:flex;gap:8px;margin-top:8px}
.mini-btn{flex:1;padding:11px;background:transparent;color:var(--ink-soft);cursor:pointer;
  border:1px solid var(--line);font-family:'Jost',sans-serif;font-size:10px;
  letter-spacing:2px;text-transform:uppercase;transition:all .3s;font-weight:300}
.mini-btn:hover{border-color:var(--dim);color:var(--ink)}
.pay-note{margin-top:14px;font-size:11px;color:var(--dim);text-align:center;line-height:1.6}
.copied-fb{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:70;
  background:var(--panel);border:1px solid var(--line);padding:9px 18px;
  font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--bone);
  opacity:0;transition:opacity .3s;pointer-events:none}
.copied-fb.show{opacity:1}
.status-ok{margin-top:6px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--bone);text-align:center}
</style>
</head>
<body>
<div class="container">

  <header class="hero">
    <div class="queen"><span class="at">@</span><span id="qName">milayaqueen</span></div>
  </header>

  <div class="sect-label"></div>
  <div id="status"></div>
  <div id="products"><div class="loader">…</div></div>

  <footer class="footer">
    <a id="contact_link" href="#" target="_blank">связаться</a>
    <span class="sep">·</span>
    <button class="admin-ghost" onclick="openAdmin()">вход</button>
  </footer>
</div>

<!-- Admin (minimal: just a password) -->
<div class="overlay" id="adminOv">
  <div class="dialog">
    <h3>вход</h3>
    <div class="sub">пароль администратора</div>
    <input type="password" id="adminPwd" placeholder="…"
           onkeydown="if(event.key==='Enter')loginAdmin()"
           style="width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);
                  padding:13px 12px;outline:none;font-family:'Jost',sans-serif;letter-spacing:3px;margin-bottom:14px">
    <button class="wallet-cta" onclick="loginAdmin()">войти</button>
    <div class="mini-row"><button class="mini-btn" onclick="closeOv('adminOv')">отмена</button></div>
  </div>
</div>

<!-- Payment / wallet -->
<div class="overlay" id="payOv">
  <div class="dialog">
    <h3>оплата</h3>
    <div class="sub" id="payOrder">заказ</div>
    <table class="req-table">
      <tr><td class="k">сумма</td><td class="v"><b id="payAmount">—</b> <span id="payCur" style="color:var(--dim-2)"></span></td></tr>
      <tr><td class="k">мемо</td><td class="v" id="payMemo">—</td></tr>
      <tr><td class="k">адрес</td><td class="v" id="payAddr">—</td></tr>
    </table>
    <button class="wallet-cta" id="walletBtn" onclick="openWalletNow()">открыть кошелёк</button>
    <div class="status-ok" id="payStatus"></div>
    <div class="mini-row">
      <button class="mini-btn" onclick="copyReqs()">копировать</button>
      <button class="mini-btn" id="chatBtn" onclick="tellGoddess()">написать богине</button>
    </div>
    <div class="pay-note">кошелёк откроется сам — реквизиты заполнятся. после перевода заказ подтвердится автоматически.</div>
  </div>
</div>

<div class="copied-fb" id="copiedFb">скопировано</div>

<script>
const tg = window.Telegram?.WebApp;
if(tg){ try{ tg.ready(); tg.expand(); tg.setHeaderColor('#070708'); tg.setBackgroundColor('#070708'); }catch(e){} }

let initData = tg?.initData || new URLSearchParams(location.search).get('initData') || '';
let CONFIG = { contact:'milayaqueen' };
let ACTIVE = null; // {order, invoice}

function headers(){
  const h={'Content-Type':'application/json'};
  if(initData) h['X-Telegram-Init-Data']=initData;
  return h;
}
function haptic(t){ if(tg?.HapticFeedback){ try{ tg.HapticFeedback.impactOccurred(t||'light'); }catch(e){} } }

/* ---------- load ---------- */
async function loadConfig(){
  try{
    const j = await (await fetch('/api/config')).json();
    if(j && j.ok && j.contact_username){
      CONFIG.contact = j.contact_username;
      const n=document.getElementById('qName');
      if(n) n.textContent = j.contact_username.replace(/^@/,'');
      const l=document.getElementById('contact_link');
      if(l){ l.href='https://t.me/'+j.contact_username; }
    }
  }catch(e){}
}

async function loadProducts(){
  const cont=document.getElementById('products');
  try{
    const r=await fetch('/api/products', {headers:headers()});
    const j=await r.json();
    if(!j.ok || !j.products || !j.products.length){
      cont.innerHTML=`<div class="msg">пока пусто</div>`;
      return;
    }
    cont.innerHTML='';
    j.products.forEach(p=>{
      const img=p.photo_file_id? `/api/media/${p.photo_file_id}` : (p.photo_url||'');
      const el=document.createElement('div'); el.className='card';
      const money = num(p.price_gram, p.price_rub);
      el.innerHTML=`
        ${img?`<img src="${img}" loading="lazy" onerror="this.style.display='none'">`:''}
        <div class="card-body">
          <div class="cat">${esc(p.category||'')||'закрыто'}</div>
          <div class="card-title serif">${esc(p.title||'')}</div>
          ${p.description?`<div class="desc">${esc((p.description||'').slice(0,220))}</div>`:''}
          <div class="price"><span>${money.val}</span><span class="unit">${money.cur}</span></div>
          <button class="buy-btn" onclick="order(${p.id}, this)">купить</button>
        </div>`;
      cont.appendChild(el);
    });
  }catch(e){
    cont.innerHTML=`<div class="msg err">нет связи с сервером</div>`;
  }
}

/* money helpers */
function num(gram, rub){
  if(gram){ return {val: fmt(gram), cur:'ton'}; }
  if(rub){ return {val: fmt(rub)+' ₽', cur:''}; }
  return {val:'—', cur:''};
}
function fmt(x){
  const f=parseFloat(x);
  if(isNaN(f)) return x;
  return (f % 1 === 0) ? f.toLocaleString('ru-RU') : String(f);
}

/* ---------- order ---------- */
async function order(id, btn){
  const orig = btn?btn.textContent:'купить';
  if(btn){ btn.disabled=true; btn.textContent='…'; }
  try{
    const r=await fetch('/api/orders/create', {method:'POST', headers:headers(), body:JSON.stringify({product_id:id})});
    const j=await r.json();
    if(!j.ok){
      haptic('heavy');
      toastMsg(j.error==='auth_required' ? 'открой через Telegram-бота' : 'ошибка: '+(j.error||'?'), true);
      return;
    }
    showPay(j.order, j.invoice);
    haptic('medium');
  }catch(e){
    toastMsg('нет связи с сервером', true);
  }finally{
    if(btn){ btn.disabled=false; btn.textContent=orig; }
  }
}

function toastMsg(t, err){
  const s=document.getElementById('status');
  s.innerHTML=`<div class="msg ${err?'err':''}">${esc(t)}</div>`;
  setTimeout(()=>{ s.innerHTML=''; }, 5000);
}

/* ---------- payment / wallet ---------- */
function showPay(order, invoice){
  ACTIVE={order, invoice};
  const amt = invoice.amount || order.amount_gram || order.amount_rub || '';
  const isGramMode = String(invoice.mode||'') === 'gram';
  document.getElementById('payOrder').textContent='заказ #'+order.id;
  document.getElementById('payAmount').textContent= fmt(amt);
  document.getElementById('payCur').textContent = isGramMode ? 'GRAM' : (order.amount_gram?'TON':'');
  document.getElementById('payMemo').textContent= invoice.memo || order.pay_memo || '';
  document.getElementById('payAddr').textContent= invoice.address || '—';
  document.getElementById('payStatus').textContent='';
  document.getElementById('payOv').classList.add('show');
  // auto-open the wallet right away if we have a target
  setTimeout(()=>{ openWalletNow(true); }, 350);
}

function buildTonLink(invoice, order){
  const addr=(invoice.address||'').trim();
  const memo=(invoice.memo||order.pay_memo||'').trim();
  if(!addr) return null;
  let link=`ton://transfer/${encodeURIComponent(addr)}`;
  const p=[];
  const amt = parseFloat(invoice.amount || order.amount_gram);
  if(amt && amt>0){ p.push(`amount=${Math.round(amt*1e9)}`); }   // nanoTON
  if(memo){ p.push('text='+encodeURIComponent(memo)); }
  if(p.length) link+='?'+p.join('&');
  return link;
}

function openWalletNow(auto){
  if(!ACTIVE) return;
  const {order, invoice}=ACTIVE;
  const st=document.getElementById('payStatus');
  const btn=document.getElementById('walletBtn');

  // 1) провайдерская ссылка, если есть
  if(invoice.pay_url){
    st.textContent='открываем счёт…';
    try{
      const a=document.createElement('a');
      a.href=invoice.pay_url; a.target='_blank'; a.rel='noopener';
      document.body.appendChild(a); a.click(); a.remove();
    }catch(e){ window.open(invoice.pay_url,'_blank'); }
    return;
  }
  // 2) ton:// с встроенными реквизитами
  const link=buildTonLink(invoice, order);
  if(link){
    st.textContent='открываем кошелёк…';
    if(btn) btn.disabled=true;
    setTimeout(()=>{
      try{
        const a=document.createElement('a');
        a.href=link; a.target='_blank'; a.rel='noopener';
        document.body.appendChild(a); a.click(); a.remove();
        if(!auto){ try{ navigator.clipboard&&navigator.clipboard.writeText(reqText()); }catch(e){} }
        if(btn) btn.disabled=false;
      }catch(e){
        if(btn) btn.disabled=false;
        window.open(link,'_blank');
      }
    }, 200);
  }else{
    st.textContent='адрес ещё не задан — напиши богине';
  }
}

function reqText(){
  if(!ACTIVE) return '';
  const {order, invoice}=ACTIVE;
  const lines=[];
  const amt = invoice.amount || order.amount_gram || order.amount_rub;
  if(amt) lines.push('Сумма: '+fmt(amt));
  if(invoice.memo||order.pay_memo) lines.push('Комментарий: '+(invoice.memo||order.pay_memo));
  if(invoice.address) lines.push('Адрес: '+invoice.address);
  return lines.join('\n');
}

function copyReqs(){
  const t=reqText();
  const fb=document.getElementById('copiedFb');
  const done=()=>{ fb.classList.add('show'); haptic('light'); setTimeout(()=>fb.classList.remove('show'),1400); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done).catch(()=>{ legacyCopy(t); done(); });
  } else { legacyCopy(t); done(); }
}
function legacyCopy(text){
  const ta=document.createElement('textarea');
  ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  ta.remove();
}
function tellGoddess(){
  if(!ACTIVE) return;
  const {order}=ACTIVE;
  const msg='заказ #'+order.id+' оплачен — проверь, пожалуйста';
  const u='https://t.me/'+CONFIG.contact;
  try{ tg?.openTelegramLink && tg.openTelegramLink(u) ? null : window.open(u,'_blank'); }
  catch(e){ window.open(u,'_blank'); }
}

/* ---------- admin ---------- */
function openAdmin(){
  document.getElementById('adminOv').classList.add('show');
  setTimeout(()=>document.getElementById('adminPwd').focus(),50);
}
function closeOv(id){ document.getElementById(id).classList.remove('show'); }
function loginAdmin(){
  const pwd=document.getElementById('adminPwd').value.trim();
  if(!pwd) return;
  window.location.href='/admin?admin_token='+encodeURIComponent(pwd);
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeOv('adminOv'); closeOv('payOv'); }});

function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

(async()=>{
  await loadConfig();
  await loadProducts();
})();
</script>
</body>
</html>
